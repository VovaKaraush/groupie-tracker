<!DOCTYPE html>
<html lang="fr">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Search Artists</title>
    </head>
    <body>
        <h1>Groupie Tracker</h1>
        
        <form method="GET" action="/">
            
            <h2>Recherche</h2>
            <input type="text" id="search" name="q" placeholder="Rechercher un artiste..." value="{{.Filters.Q}}">
            
            
            <h2>Filtres</h2>
            <div>
                <label>Date de création (min):</label>
                <input type="number" id="creationDateMin" name="creationDateMin" placeholder="Année min" value="{{.Filters.CreationDateMin}}">
                
                <label>Date de création (max):</label>
                <input type="number" id="creationDateMax" name="creationDateMax" placeholder="Année max" value="{{.Filters.CreationDateMax}}">
            </div>
            
            <div>
                <label>Premier album (min):</label>
                <input type="number" id="firstAlbumMin" name="firstAlbumMin" placeholder="Année min" value="{{.Filters.FirstAlbumMin}}">
                
                <label>Premier album (max):</label>
                <input type="number" id="firstAlbumMax" name="firstAlbumMax" placeholder="Année max" value="{{.Filters.FirstAlbumMax}}">
            </div>
            
            <div>
                <label>Nombre de membres (min):</label>
                <input type="number" id="membersMin" name="membersMin" placeholder="Min" value="{{.Filters.MembersMin}}">
                
                <label>Nombre de membres (max):</label>
                <input type="number" id="membersMax" name="membersMax" placeholder="Max" value="{{.Filters.MembersMax}}">
            </div>
            
            <div>
                <label>Localisation:</label>
                <input type="text" id="locations" name="locations" placeholder="Villes (séparées par des virgules)" value="{{.Filters.Locations}}">
            </div>
            
            <button type="submit">Filters</button>
        </form>
        
        <div id="results"></div>
            {{if .Artists}}
                {{range .Artists}}
                    <div style="border:1px solid #ffffff; padding:10px; margin:10px 0;">
                        <p><strong>{{.Name}}</strong></p>
                        <p>Création: {{.CreationDate}}</p>
                        <p>Premier album: {{.FirstAlbum}}</p>
                        <p>Membres:{{range $i, $m := .Members}}{{if $i}}, {{end}}{{$m}}{{end}}</p>
                    </div>
                {{end}}
            {{else}}
                <p>Aucun résultat</p>
            {{end}}
        </div>
    </body>
</html>
