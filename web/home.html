<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Artists</title>
</head>
<body>
    <h1>Groupie Tracker</h1>
    
    <form method="get" action="/search">
        <h2>Recherche</h2>
        <input type="text" name="q" placeholder="Rechercher un artiste..." value="{{.Q}}">

        <h2>Filtres</h2>
        <div>
            <label>Date de création (min):</label>
            <input type="number" name="creationDateMin" placeholder="Année min" value="{{.CreationDateMin}}">
            <label>Date de création (max):</label>
            <input type="number" name="creationDateMax" placeholder="Année max" value="{{.CreationDateMax}}">
        </div>

        <div>
            <label>Premier album (min):</label>
            <input type="number" name="firstAlbumMin" placeholder="Année min" value="{{.FirstAlbumMin}}">

            <label>Premier album (max):</label>
            <input type="number" name="firstAlbumMax" placeholder="Année max" value="{{.FirstAlbumMax}}">
        </div>

        <div>
            <label>Nombre de membres (min):</label>
            <input type="number" name="membersMin" placeholder="Min" value="{{.MembersMin}}">

            <label>Nombre de membres (max):</label>
            <input type="number" name="membersMax" placeholder="Max" value="{{.MembersMax}}">
        </div>

        <div>
            <label>Localisation:</label>
            <input type="text" name="locations" placeholder="Villes (séparées par des virgules)" value="{{.Locations}}">
        </div>

        <button type="submit">Filtrer</button>
    </form>
    
    <div id="results">
        {{if .Artists}}
            {{range .Artists}}
                <div style="border: 1px solid #ccc; padding: 10px; margin: 10px 0;">
                    <p><strong>{{.Name}}</strong></p>
                    <p>Création: {{.CreationDate}}</p>
                    <p>Premier album: {{.FirstAlbum}}</p>
                    <p>Membres: {{range $i, $m := .Members}}{{if $i}}, {{end}}{{$m}}{{end}}</p>
                </div>
            {{end}}
        {{else}}
            <p>Aucun résultat</p>
        {{end}}
    </div>

</body>
</html>
